name: FreeBSD Rust version

on:
  # To run manually workflow
  workflow_dispatch:

  # Schedule workflow
  schedule:
    - cron: "0 23 * * *"

env:
  FREEBSD_VERSION: '15.1'

permissions:
  contents: write

jobs:
  rust-version:
    name: Get FreeBSD Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Start FreeBSD VM
      id: start-freebsd
      uses: cross-platform-actions/action@24ef01df165c76df1ed2b9f9e9212e78dc2fc963 # v1.4.0
      with:
        operating_system: freebsd
        version: ${{ env.FREEBSD_VERSION }}
        sync_files: true

    - name: Get FreeBSD Rust version
      id: get-rust-version
      shell: cpa.sh {0}
      run: |
        set -e
        sh get_freebsd_rust_version.sh

    - name: Dump FreeBSD Rust version
      id: dump-version
      run: |
        echo "Rust version = $RUST_VERSION"
        if $SAME_VERSION; then
          echo "No need to commit new Rust version"
          echo "**Current Rust version:** $RUST_VERSION on FreeBSD ${{ env.FREEBSD_VERSION }}" >> $GITHUB_STEP_SUMMARY
        else
          echo "Rust version changed => need to commit it"
          echo "**New Rust version:** $RUST_VERSION on FreeBSD ${{ env.FREEBSD_VERSION }}" >> $GITHUB_STEP_SUMMARY
        fi
        printf "\n"
        cat freebsd_rust_version.txt

    - name: Commit FreeBSD Rust version
      id: commit-version
      if: env.SAME_VERSION == 'false'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add freebsd_rust_version.txt
        git commit -m "Update for FreeBSD Rust version ${{ env.RUST_VERSION }}" -m "Automatic commit by job '${{ github.job }}' - run #${{ github.run_number }}"
        git tag "${{ env.RUST_VERSION }}"
        git push
        git push --tags
